<svg xmlns="http://www.w3.org/2000/svg" width="520" height="270" viewBox="0 0 520 270" role="img" aria-label="Clawd, the Claude Code mascot, saying: hi, it's me :3">
<defs><style>
@font-face{font-family:Pg;src:url(data:font/woff2;base64,) format("woff2")}
@font-face{font-family:Jb;src:url(data:font/woff2;base64,) format("woff2")}
.hand{font:400 24px Pg,"Comic Sans MS",cursive;fill:#b57cff;stroke:#b57cff;stroke-width:.6;stroke-linejoin:round}
.l{fill:none;stroke:#b57cff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pink{fill:#f38ba8;stroke:#f38ba8}
.mono{font:400 15px Jb,"JetBrains Mono",monospace;fill:#9399b2}
.title{fill:#cdd6f4}
.orange{fill:#d97757}
.wob{animation:wob .9s steps(1) infinite}
@keyframes wob{0%{filter:url(#b0)}33%{filter:url(#b1)}66%{filter:url(#b2)}}
.bob{animation:bob 1.6s steps(1) infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.blink{opacity:0;animation:blink 4.2s steps(1) infinite}
@keyframes blink{0%,90%{opacity:0}91%,95%{opacity:1}96%{opacity:0}}
.wave{transform-box:fill-box;transform-origin:0 100%;animation:wave 4.2s steps(1) infinite}
@keyframes wave{0%,40%,70%,100%{transform:translateY(0)}45%,55%,65%{transform:translateY(-18px)}50%,60%{transform:translateY(-9px)}}
.spin{animation:spin 1.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cur{animation:cur 1.1s steps(1) infinite}
@keyframes cur{50%{opacity:0}}
.nudge{animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}
</style><filter id="b0" filterUnits="userSpaceOnUse" x="0" y="0" width="520" height="100"><feTurbulence type="turbulence" baseFrequency="0.066" numOctaves="1" seed="1" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.1" xChannelSelector="R" yChannelSelector="G"/></filter><filter id="b1" filterUnits="userSpaceOnUse" x="0" y="0" width="520" height="100"><feTurbulence type="turbulence" baseFrequency="0.066" numOctaves="1" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.1" xChannelSelector="R" yChannelSelector="G"/></filter><filter id="b2" filterUnits="userSpaceOnUse" x="0" y="0" width="520" height="100"><feTurbulence type="turbulence" baseFrequency="0.066" numOctaves="1" seed="13" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.1" xChannelSelector="R" yChannelSelector="G"/></filter></defs>

<g class="wob" filter="url(#b0)">
