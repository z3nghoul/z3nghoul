 width="9" height="18"/><rect x="126" y="54" width="9" height="18"/><rect x="36" y="72" width="9" height="18"/><rect x="54" y="72" width="9" height="18"/><rect x="99" y="72" width="9" height="18"/><rect x="117" y="72" width="9" height="18"/>
