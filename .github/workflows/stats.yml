name: stats cards

# Renders the github stats and top languages cards into assets/ once a day,
# so the profile README does not depend on the public github-readme-stats
# instance, and puts 8 random splash lines from z3n1337.dev into the typing
# line of the README. Third-party actions are pinned to full commit SHAs.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/stats.yml
      - .github/scripts/embed_font.py
      - .github/scripts/splashes.py
      - assets/fonts/**

permissions:
  contents: write

concurrency:
  group: stats-cards
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: render stats
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: stats
          options: username=z3nghoul&custom_title=activity&show_icons=true&hide=stars,contribs&hide_rank=true&line_height=30&card_width=360&icon_color=cba6f7&hide_border=true&border_radius=10&theme=catppuccin_mocha&bg_color=1e1e2e&title_color=cba6f7&text_color=cdd6f4&disable_animations=true
          path: assets/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          # empty: use the core package bundled with the action (frozen lockfile)
          # instead of installing a floating "v2" from npm at run time
          core_version: ""

      - name: render top languages
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: top-langs
          options: username=z3nghoul&custom_title=languages&layout=compact&langs_count=4&card_width=360&hide_border=true&border_radius=10&theme=catppuccin_mocha&bg_color=1e1e2e&title_color=cba6f7&text_color=cdd6f4&disable_animations=true
          path: assets/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          core_version: ""

      - name: embed jetbrains mono
        run: python3 .github/scripts/embed_font.py assets/stats.svg assets/top-langs.svg

      - name: pick splashes
        run: python3 .github/scripts/splashes.py README.md

      - name: commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/top-langs.svg README.md
          if ! git diff --cached --quiet; then
            git commit -m "stats: refresh cards and splashes"
            git pull --rebase origin main
            git push
          fi
