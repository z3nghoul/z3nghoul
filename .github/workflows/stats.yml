name: stats cards

# Renders the github stats and top languages cards into assets/ once a day,
# so the profile README does not depend on the public github-readme-stats
# instance. Third-party actions are pinned to full commit SHAs.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/stats.yml]

permissions:
  contents: write

concurrency:
  group: stats-cards
  cancel-in-progress: true

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: render stats
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: stats
          options: username=z3nghoul&show_icons=true&hide=contribs&line_height=32&hide_border=true&theme=catppuccin_mocha&bg_color=1e1e2e&title_color=cba6f7&icon_color=f5c2e7&text_color=cdd6f4
          path: assets/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          # empty: use the core package bundled with the action (frozen lockfile)
          # instead of installing a floating "v2" from npm at run time
          core_version: ""

      - name: render top languages
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: top-langs
          options: username=z3nghoul&langs_count=3&hide_border=true&theme=catppuccin_mocha&bg_color=1e1e2e&title_color=cba6f7&text_color=cdd6f4
          path: assets/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          core_version: ""

      - name: commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/top-langs.svg
          if ! git diff --cached --quiet; then
            git commit -m "stats: refresh cards"
            git push
          fi
